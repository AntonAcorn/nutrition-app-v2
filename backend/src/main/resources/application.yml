spring:
  application:
    name: nutrition-backend
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nutrition_app}
    username: ${DB_USER:nutrition}
    password: ${DB_PASSWORD:nutrition}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30d}
      cookie:
        max-age: ${SESSION_COOKIE_MAX_AGE:30d}
        same-site: lax
        secure: true

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

nutrition:
  app:
    base-url: ${APP_BASE_URL:http://localhost:5173}
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
    google-redirect-uri: ${GOOGLE_REDIRECT_URI:${nutrition.app.base-url}/api/auth/google/callback}
    # Default = iOS client ID currently shipped in the Capacitor app
    # (source of truth: frontend/src/features/auth/model/authApi.ts).
    # Override via GOOGLE_NATIVE_CLIENT_IDS to add Android or a rotated iOS client.
    google-native-client-ids: ${GOOGLE_NATIVE_CLIENT_IDS:12070092066-84aqttkj4oa7786751ifg1huf0stvsja.apps.googleusercontent.com}
  ai-analysis:
    daily-limit: ${AI_ANALYSIS_DAILY_LIMIT:30}
  ai-budget:
    # Hard ceiling on total AI cost (cents) per UTC day across all users.
    # Backstop to per-user quotas — protects against viral spikes / runaway
    # scripts. When exceeded, /api/photo-analysis/* and coach endpoints return
    # 503 until midnight UTC. Set to 0 to disable. Default = $5/day.
    daily-cents: ${AI_DAILY_BUDGET_CENTS:500}
  paywall:
    # Master switch for the monetization layer. When false (open-beta / pre-tax-
    # registration mode), every user is treated as PRO: AI quota is unlimited,
    # PaywallSheet never opens, FounderBanner hides. RevenueCat infrastructure
    # stays in code, ready to flip back on. See memory/project_monetization.md.
    enabled: ${PAYWALL_ENABLED:false}
  revenuecat:
    # Shared "Authorization" header value RevenueCat sends with every webhook.
    # Configure it in RevenueCat dashboard -> Project -> Integrations -> Webhooks.
    # If blank, the webhook endpoint rejects all requests (safe default).
    webhook-auth: ${REVENUECAT_WEBHOOK_AUTH:}
    # IAP product IDs that grant the Founder Lifetime entitlement.
    # Comma-separated. Configure in App Store Connect AND RevenueCat.
    founder-product-ids: ${REVENUECAT_FOUNDER_PRODUCTS:rumbly_founder_lifetime}
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    vapid-subject: ${VAPID_SUBJECT:mailto:admin@rumblyeats.org}
  photo-analysis:
    enabled: ${PHOTO_ANALYSIS_ENABLED:true}
    provider: ${PHOTO_ANALYSIS_PROVIDER:openai-stub}
    openai:
      api-key: ${PHOTO_OPENAI_API_KEY:${OPENAI_API_KEY:}}
      model: ${OPENAI_MODEL:gpt-4.1-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      timeout-ms: ${OPENAI_TIMEOUT_MS:25000}
  coach:
    enabled: ${COACH_ENABLED:true}
    provider: ${COACH_PROVIDER:openai-stub}
    # Open-beta default = 168h (weekly cadence) to keep coach LLM cost bounded.
    # Bump down to 72h once paywall is on and Pro users justify the spend.
    validity-hours: ${COACH_VALIDITY_HOURS:168}
    min-logged-days: ${COACH_MIN_LOGGED_DAYS:3}
    openai:
      api-key: ${COACH_OPENAI_API_KEY:${OPENAI_API_KEY:}}
      model: ${COACH_MODEL:gpt-4o-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      timeout-ms: ${COACH_TIMEOUT_MS:30000}

sentry:
  environment: ${SENTRY_ENVIRONMENT:production}
