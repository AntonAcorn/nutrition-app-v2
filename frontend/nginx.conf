server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed Vite assets (index-XXXX.js, ProfileTab-XXXX.js, etc.) — safe to
    # cache forever, content-addressed by hash.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker and HTML entry — must always revalidate so a fresh deploy
    # is picked up on next launch (WKWebView's URL cache otherwise pins the
    # old index.html that references chunk hashes no longer on disk).
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # SPA fallback — everything else goes to index.html with the same no-cache
    # so deep links also re-validate.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
