<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email confirmed — Puzometr</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0e11;
      color: rgba(255,255,255,0.85);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      max-width: 400px;
      width: 100%;
      text-align: center;
      background: #101114;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 28px;
      padding: 2.5rem 2rem;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { font-size: 0.9rem; color: rgba(255,255,255,0.5); margin-bottom: 1.5rem; }
    a {
      display: inline-block;
      background: #fff;
      color: #0d0e11;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 12px 28px;
      border-radius: 12px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Email confirmed!</h1>
    <p>Your account is now active. You can log in and start tracking.</p>
    <a href="/">Open app</a>
  </div>
</body>
</html>
